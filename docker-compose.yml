services:
  roundcubemail:
    image: roundcube/roundcubemail:latest
    container_name: roundcubemail
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
      - /data/local/webmail.neuf.no/plugins/identity_smtp:/var/www/html/plugins/identity_smtp
    ports:
      - 9002:80
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mx.neuf.no
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mx.neuf.no
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,identity_smtp 

