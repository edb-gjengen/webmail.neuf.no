services:
  roundcubemail:
    image: roundcube/roundcubemail:1.6.20-apache
    container_name: roundcubemail
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      #- ./www:/var/www/html
      - /data/local/webmail.neuf.no/db/sqlite:/var/roundcube/db
      - /data/local/webmail.neuf.no/plugins/identity_smtp:/var/www/html/plugins/identity_smtp
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mx.neuf.no
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mx.neuf.no
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,identity_smtp 

